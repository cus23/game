<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3ed">
  <title>ikeDay</title>
  <link rel="icon" href="./appicon.png" type="image/svg+xml">
  <link rel="shortcut icon" href="./appicon.png" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./appicon.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="ikeDay home"><img src="./appicon.png" alt=""><span>ikeDay</span></a>
    <div class="paw-note" aria-label="dog and paw">🦮🐾</div>
  </header>
  <main>
    <section id="lockScreen" class="lock-screen">
      <div class="lock-copy">
        <h1 class="lock-brand">ikeDay</h1>
        <form id="unlockForm">
          <label for="password">密碼</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="輸入密碼" required>
          <button type="submit">開啟日曆 <span>↗</span></button>
        </form>
        <p id="lockError" class="error" role="alert"></p>
        <p class="privacy-note">🔒 紀錄會在這台裝置的瀏覽器內加密保存。</p>
      </div>
    </section>
    <section id="tracker" hidden>
      <div class="intro-row">
        <div><h1>Little days, <em>big paws.</em></h1><p class="sub">2026.05.08 부터 💭</p></div>
      </div>
      <section class="calendar-card">
        <div class="calendar-head">
          <div><p class="eyebrow">YOUR CALENDAR</p><h2 id="monthLabel"></h2></div>
          <div class="month-nav"><button id="prevMonth" aria-label="上個月">‹</button><button id="nextMonth" aria-label="下個月">›</button></div>
        </div>
        <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div id="calendar" class="calendar"></div>
        <div class="legend"><span><i class="yes-dot"></i> 🐾 有來</span></div>
      </section>
      <section id="markPanel" class="mark-panel" hidden>
        <div class="selected-date"><p class="eyebrow">SELECTED DAY</p><h2 id="selectedDate"></h2></div>
        <div class="mark-actions">
          <button id="markYes" class="mark-button yes">🐾 有來</button>
          <button id="clearMark" class="clear-button">取消標記</button>
        </div>
      </section>
      <section class="year-card">
        <div class="year-head"><div><h2>一年來了幾次？</h2><p>每個月收到訊息的天數 🐾</p></div><div class="year-total"><strong id="yearTotal">0</strong><span>天有來</span></div></div>
        <div id="yearChart" class="year-chart" role="img" aria-label="2026 每月有收到訊息的天數長條圖"></div>
      </section>
      <section class="subscription-card" aria-label="訂閱天數與統計">
        <div class="stat-orbit year-orbit">
          <div class="year-progress" id="yearProgress" role="img" aria-label="今年已經過去的比例">
            <div class="year-progress-inner">
              <span id="yearPercentValue" class="year-percent-value">88</span><span class="year-percent-symbol">%</span>
            </div>
          </div>
        </div>
        <div class="stat-orbit weekday-orbit">
          <div class="weekday-progress" id="weekdayProgress" role="img" aria-label="週一至週日收到訊息的分布"></div>
        </div>
        <div class="subscription-count">
          <strong id="subscriptionDays">+192</strong>
          <span class="days-word">D♡ys</span>
          <span class="subscribe-date">by 2026.5.9</span>
        </div>
      </section>
      <section class="backup-card">
        <div><p class="eyebrow">YOUR DATA</p><h2>備份與還原</h2><p>JSON 會以密碼加密，匯入時使用相同密碼。</p></div>
        <div class="backup-actions"><button id="exportBtn">↓ 匯出 JSON</button><label class="import-button">↑ 匯入 JSON<input id="importFile" type="file" accept=".json,application/json"></label></div>
      </section>
      <button id="lockBtn" class="lock-button">鎖定日曆</button>

    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>

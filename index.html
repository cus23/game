function renderFeed(){
 const x=m();$('screen').innerHTML=header('FEED','home')+'<div class="content"><div class="eyebrow">SOCIAL / STORY UNIVERSE</div><div class="heading">動態牆</div><div class="sub">虛構社群貼文與你的故事生活。</div><div class="card"><div class="chathead">'+av(x,36)+'<div><b>'+x.name+'</b><small>今天 · 18:42</small></div></div><div class="feedphoto">🌆</div><div style="font-family:Noto Sans KR;font-size:12px">오늘 하늘 예쁘다. 다들 잘 지내?</div><div class="sub" style="margin-top:6px">今天的天空很漂亮。大家都過得好嗎？</div><div class="postactions"><span id="likePost">♡　<span id="likeCount">128</span></span><span id="commentPost">◯　留言</span><span>↗　分享</span></div></div><div class="card"><div class="eyebrow">YOUR STORY</div><b style="font-size:12px">寫下今天的心情</b><textarea id="postText" class="field" rows="3" style="margin-top:10px" placeholder="今天想記錄什麼？"></textarea><button class="primary" id="postBtn" style="margin-top:8px">發布到私人日記牆</button></div>'+(S.posts.map(p=>'<div class="card"><div class="eyebrow">'+esc(p.date)+'</div><p style="font-size:12px;line-height:1.7">'+esc(p.text)+'</p></div>').join(''))+'<div class="notice">成員貼文為虛構情境，並非真實社群內容。</div></div>';
 $('likePost').onclick=()=>{const n=$('likeCount');n.textContent=Number(n.textContent)+1;toast('已留下喜歡')};$('commentPost').onclick=()=>modal('<button class="close" id="x">×</button><h3>留言</h3><p>這是一則虛構貼文，留言功能會在後續版本開放。</p>');if($('x'))$('x').onclick=closeModal;
 $('postBtn').onclick=()=>{const v=$('postText').value.trim();if(!v)return;S.posts.unshift({text:v,date:new Date().toLocaleDateString('zh-TW')});save();renderFeed();toast('已儲存到私人動態牆')}
}
function renderAlbum(){
 $('screen').innerHTML=header('ALBUM','home')+'<div class="content"><div class="eyebrow">MEMORY BOX</div><div class="heading">故事相簿</div><div class="sub">收集劇情中的小小紀念。</div><div class="membergrid" style="margin-top:15px"><div class="card"><div class="feedphoto">☔</div><b style="font-size:11px">雨停之前</b><div class="sub">Chapter 01</div></div><div class="card"><div class="feedphoto">🎧</div><b style="font-size:11px">凌晨的語音</b><div class="sub">Chapter 02</div></div><div class="card"><div class="feedphoto">🌆</div><b style="font-size:11px">不在計畫裡的邀約</b><div class="sub">Chapter 03</div></div><div class="card"><div class="feedphoto">✉️</div><b style="font-size:11px">未讀的信</b><div class="sub">Coming soon</div></div></div><div class="notice">相簿使用原創漸層插畫與符號呈現，不包含成員肖像。</div></div>'
}
function renderCalendar(){
 $('screen').innerHTML=header('CALENDAR','home')+'<div class="content"><div class="eyebrow">SCHEDULE / FICTIONAL STORY TIMELINE</div><div class="heading">行程與時間</div><div class="sub">故事裡的日常安排，並非真實行程或即時資訊。</div><div class="card"><div class="eyebrow">TODAY · DAY '+S.day+'</div><div class="heading" style="font-size:17px">'+m().name+' 的一天</div><div style="margin-top:18px"><div class="event"><b>09:30　團體練習</b><small>Practice room</small><p>上午行程比較滿，可能沒辦法即時回覆訊息。</p></div><div class="event"><b>13:00　午餐時間</b><small>Break time</small><p>趁空檔吃飯，回覆幾則訊息。</p></div><div class="event"><b>17:30　個人時間</b><small>Free time</small><p>今天稍微有一點自己的時間。</p></div><div class="event"><b>21:00　回到宿舍</b><small>Night</small><p>也許會傳訊息來聊聊今天。</p></div></div></div><button class="primary" id="tomorrow">翻到明天　→</button></div>';
 $('tomorrow').onclick=()=>{S.day++;S.messages.push({from:'them',ko:'오늘도 좋은 하루 보내. 어제 얘기 재밌었어 ㅎㅎ',tr:'今天也要度過愉快的一天。昨天聊天很有趣 ㅎㅎ',time:'09:12'});save();renderCalendar();toast('已進入 Day '+S.day)}
}
function renderNotes(){
 $('screen').innerHTML=header('NOTES','home')+'<div class="content"><div class="eyebrow">PRIVATE JOURNAL</div><div class="heading">我的日記</div><div class="sub">只儲存在這個瀏覽器裡。</div><textarea class="field" id="diaryInput" rows="4" style="margin-top:16px" placeholder="今天想記住什麼？"></textarea><button class="primary" id="saveDiary" style="margin-top:8px">儲存日記</button><div style="margin-top:20px">'+(S.diary.length?S.diary.map(d=>'<div class="card"><div class="eyebrow">'+esc(d.date)+'</div><p style="font-size:12px;line-height:1.7">'+esc(d.text)+'</p></div>').join(''):'<div class="sub" style="text-align:center;padding:25px">還沒有日記。</div>')+'</div></div>';
 $('saveDiary').onclick=()=>{const v=$('diaryInput').value.trim();if(!v)return;S.diary.unshift({text:v,date:new Date().toLocaleDateString('zh-TW')});save();renderNotes();toast('已儲存')}
}
function renderSettings(){
 $('screen').innerHTML=header('SETTINGS','home')+'<div class="content"><div class="eyebrow">YOUR PROFILE</div><div class="heading">設定與關係</div><div class="card" style="display:flex;align-items:center;gap:11px">'+av(m())+'<div><b style="font-size:13px">'+m().name+' · '+m().cn+'</b><div class="sub">'+m().tag+'</div></div></div><div class="statline"><b>熟悉程度</b><span>'+S.aff+' / 100</span></div><div class="progress"><span style="width:'+S.aff+'%"></span></div><div class="statline"><b>信任感</b><span>'+S.trust+' / 100</span></div><div class="progress"><span style="width:'+S.trust+'%"></span></div><div class="card"><div class="eyebrow">STORY RECORD</div><div class="statline"><span>故事天數</span><b>'+S.day+'</b></div><div class="statline"><span>已完成選擇</span><b>'+S.choiceLog.length+'</b></div><div class="statline"><span>KKT 訊息</span><b>'+S.messages.length+'</b></div></div><button class="choice" id="saveExport">⬇　匯出遊戲存檔</button><button class="choice" id="switchRoute">↻　重新選擇曖昧對象</button><button class="choice" id="resetAll" style="color:#bd7c88">清除全部遊戲資料</button><div class="notice">進度儲存在本機瀏覽器。匯出 JSON 可備份，換裝置時再匯入（匯入功能下一版加入）。</div><p class="sub" style="font-size:9px;margin-top:15px">AFTERGLOW 是非官方粉絲創作。角色互動、對話、社群內容與行程均為虛構，不代表 ENHYPEN 成員本人或其官方平台。</p></div>';
 $('saveExport').onclick=()=>download('afterglow-save.json',JSON.stringify(S,null,2));
 $('switchRoute').onclick=()=>{modal('<button class="close" id="x">×</button><h3>重新選擇對象？</h3><p>這會重開一條獨立故事線，並清除目前對話與關係進度。建議先匯出存檔。</p><button class="primary" id="yes">重新選擇</button>');$('x').onclick=closeModal;$('yes').onclick=()=>{S.started=false;S.member=null;S.app='home';S.messages=[];S.wvs=[];S.aff=10;S.trust=8;S.day=1;S.chapter=0;S.part=0;S.choiceLog=[];S.storyFlags={};save();closeModal();render()}};
 $('resetAll').onclick=()=>{modal('<h3>確定清除全部資料？</h3><p>聊天、日記、故事進度都會被清除。</p><button class="primary" id="yes">確認清除</button><button class="secondary" id="x" style="width:100%;margin-top:8px">取消</button>');$('x').onclick=closeModal;$('yes').onclick=()=>{localStorage.removeItem(KEY);S={started:false,name:'Nora',member:null,app:'home',messages:[],wvs:[],aff:10,trust:8,day:1,chapter:0,part:0,choiceLog:[],diary:[],posts:[],unread:0,notif:[],storyFlags:{},kktTab:'chat',wvsTab:'dm'};closeModal();render()}};
}
function download(name,text){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showLock(){if(!S.started)return;$('lock').classList.remove('hide');$('lockTime').textContent=time();$('lockNotif').innerHTML='<b>AFTERGLOW · '+m().name+'</b>'+(S.messages.length?esc(S.messages[S.messages.length-1].tr||S.messages[S.messages.length-1].text):'你的故事正在等你回來。')}
$('unlock').onclick=()=>$('lock').classList.add('hide');
load();render();$('statusTime').textContent=time();setInterval(()=>$('statusTime').textContent=time(),15000);
</script></main></div></body></html>
